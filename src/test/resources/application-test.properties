# Test Database Configuration (H2 in-memory for fast, isolated tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 doesn't support JSON type - map it to VARCHAR
spring.jpa.properties.hibernate.type.preferred_json_ddl_type=VARCHAR

# Disable whitelabel error page
server.error.whitelabel.enabled=false
server.error.include-message=always

# Test API Key
API_KEY=test_api_key_3a3362750dc52748956565d9f991b358dbd3d428

